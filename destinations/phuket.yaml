# exposed_to: swell directions each zone faces.
# Used to join with marine forecast swell_direction → per-zone sea state.
# Degrees: 0=N, 90=E, 180=S, 270=W. Range ±45° from center.
exposed_to:
  kata:     { direction: 240, label: "SW (Andaman)" }     # west coast, faces SW monsoon swell
  karon:    { direction: 240, label: "SW (Andaman)" }
  patong:   { direction: 270, label: "W (Andaman)" }       # faces due west
  bang_tao: { direction: 280, label: "WNW (Andaman)" }     # faces WNW
  kamala:   { direction: 270, label: "W (Andaman)" }        # west coast between Patong and Bang Tao
  rawai:    { direction: 180, label: "S (south tip)" }       # south tip, some monsoon exposure
  panwa:    { direction: 135, label: "SE (sheltered)" }     # east side, sheltered from monsoon
  old_town: { direction: 90,  label: "E (sheltered)" }      # east side, inner harbor
  mai_khao: { direction: 280, label: "WNW (Andaman)" }      # north west coast
  airport:  { direction: 0,   label: "N (no coast)" }       # inland, not wave-relevant
  natai:    { direction: 270, label: "W (Andaman)" }         # west coast, north of airport
  khao_lak: { direction: 270, label: "W (Andaman)" }        # west coast, full monsoon exposure
  ko_yao:   { direction: 90,  label: "E (Phang Nga Bay)" }  # east-facing, sheltered in the bay

env_variables: [weather, marine]

season:
  high: [nov, dec, jan, feb, mar, apr]
  shoulder: [may, oct]
  low: [jun, jul, aug, sep]
  holidays:
    - name: Songkran
      dates: [apr-13, apr-15]
    - name: Loy Krathong
      date_rule: full_moon_nov
    - name: Chinese New Year
      date_rule: lunar_new_year
    - name: Christmas & New Year
      dates: [dec-20, jan-05]

query_seeds: [families, teenagers, rain, seniors, half-day, tonight, cheap, luxury]

time_buckets:
  morning: { start: "07:00", end: "11:00" }
  midday:  { start: "11:00", end: "16:00" }
  evening: { start: "16:00", end: "21:00" }

traffic_factors:
  kata:     { morning: 1.0, midday: 1.1, evening: 1.4 }
  karon:    { morning: 1.0, midday: 1.1, evening: 1.4 }
  patong:   { morning: 1.1, midday: 1.2, evening: 1.5 }
  kamala:   { morning: 1.0, midday: 1.0, evening: 1.3 }
  bang_tao: { morning: 1.0, midday: 1.0, evening: 1.3 }
  rawai:    { morning: 1.0, midday: 1.0, evening: 1.2 }
  panwa:    { morning: 1.0, midday: 1.0, evening: 1.1 }
  old_town: { morning: 1.1, midday: 1.2, evening: 1.3 }
  mai_khao: { morning: 1.0, midday: 1.0, evening: 1.1 }
  airport:  { morning: 1.0, midday: 1.0, evening: 1.1 }
  natai:    { morning: 1.0, midday: 1.0, evening: 1.0 }
  khao_lak: { morning: 1.0, midday: 1.0, evening: 1.0 }
  ko_yao:   { morning: 1.0, midday: 1.0, evening: 1.0 }

catalog_sources:
  - provider: viator
    destination_id: "349"     # Phuket — includes Khao Lak, Phang Nga, Natai products
    synced: true
  # Khao Lak (5439), Phang Nga (26571), Ko Yao (50498) return 0 products
  # on Viator — all inventory is tagged to dest 349. No separate sync needed.

# Serving semantics:
# - Zones are physical geography (beaches, towns, airports, islands).
# - Catalog sources are provider-scoped (Viator dest 349 covers all zones).
# - The brand ("Thailand Fun Experiences") is how travelers speak —
#   promotion of a zone-cluster to its own brand is config, never code.

shell:
  brand: "Thailand Fun Experiences"
  domain: "ThailandFunExperiences.com"
  app_scope: country
